[project]
name = "empirical-tools"
version = "0.1.0"
description = "Empirical Security tooling: reusable API clients plus runnable scripts (first: the Qualys KnowledgeBase join)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "tenacity>=9.0",
]

[project.scripts]
qualys-empirical-join = "scripts.qualys_empirical_join.cli:main"
qualys-empirical-check = "scripts.qualys_empirical_join.credentials_check:main"
simple-qid-posture-export = "scripts.simple_qid_posture_export.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/shared",
    "src/empirical_client",
    "src/qualys_client",
    "src/scripts",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
